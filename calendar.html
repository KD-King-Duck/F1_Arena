<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendrier – Arena</title><link rel="stylesheet" href="css/style.css"></head><body><header id="nav" class="top"></header><main><h1>Calendrier</h1><section class="block"><h2>Championnat</h2><form class="panel" id="cf"><input type="hidden" name="rid"><label>Nom du championnat<input name="nm" required maxlength="80" placeholder="Championnat 2026"></label><button>Enregistrer</button><button type="reset">Annuler</button><button type="button" class="ghost" id="delChamp">Supprimer ce championnat</button></form></section><section class="block"><h2>Saison</h2><form class="panel" id="sf"><input type="hidden" name="rid"><label>Nom de la saison<input name="sn" required maxlength="80" placeholder="Saison 1"></label><button>Enregistrer</button><button type="reset">Annuler</button><button type="button" class="ghost" id="delSeason">Supprimer cette saison</button></form><div class="panel" id="copyBox"></div></section><section class="block"><h2>Grands Prix</h2><form class="panel" id="rf"><input type="hidden" name="rid"><label>Nom du GP<input name="nm" required maxlength="120"></label><label>Circuit<input name="circ" maxlength="120"></label><label>Date<input type="date" name="dt" required></label><label class="row"><input type="checkbox" name="spr">Course sprint</label><button>Enregistrer le GP</button><button type="reset">Annuler</button></form><div id="list"></div></section></main><script src="js/common.js"></script><script src="js/calendar.js"></script></body></html>
