<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Calendrier – Arena</title>

    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <!-- Conteneur de navigation destiné au JavaScript. -->
    <header id="nav" class="top"></header>

    <main>
      <h1>Calendrier</h1>

      <!-- Gestion du championnat : enregistrement et suppression. -->
      <section class="block">
        <h2>Championnat</h2>

        <form class="panel" id="cf">
          <!-- Identifiant technique ; conserver son nom pour le JavaScript. -->
          <input type="hidden" name="rid">

          <label>
            Nom du championnat
            <input
              name="nm"
              required
              maxlength="80"
              placeholder="Championnat 2026"
            >
          </label>

          <button>Enregistrer</button>
          <button type="reset">Annuler</button>

          <!-- Action distincte de la soumission du formulaire. -->
          <button type="button" class="ghost" id="delChamp">
            Supprimer ce championnat
          </button>
        </form>
      </section>

      <!-- Gestion de la saison et emplacement des options de copie. -->
      <section class="block">
        <h2>Saison</h2>

        <form class="panel" id="sf">
          <input type="hidden" name="rid">

          <label>
            Nom de la saison
            <input
              name="sn"
              required
              maxlength="80"
              placeholder="Saison 1"
            >
          </label>

          <button>Enregistrer</button>
          <button type="reset">Annuler</button>

          <button type="button" class="ghost" id="delSeason">
            Supprimer cette saison
          </button>
        </form>

        <!-- Zone de copie dont le contenu est à vérifier dans calendar.js. -->
        <div class="panel" id="copyBox"></div>
      </section>

      <!-- Formulaire de gestion des Grands Prix et liste associée. -->
      <section class="block">
        <h2>Grands Prix</h2>

        <form class="panel" id="rf">
          <input type="hidden" name="rid">

          <label>
            Nom du GP
            <input name="nm" required maxlength="120">
          </label>

          <label>
            Circuit
            <input name="circ" maxlength="120">
          </label>

          <label>
            Date
            <input type="date" name="dt" required>
          </label>

          <label class="row">
            <input type="checkbox" name="spr">
            Course sprint
          </label>

          <button>Enregistrer le GP</button>
          <button type="reset">Annuler</button>
        </form>

        <!-- Emplacement destiné à la liste des Grands Prix. -->
        <div id="list"></div>
      </section>
    </main>

    <!-- Conserver l'ordre de chargement des scripts. -->
    <script src="js/common.js"></script>
    <script src="js/calendar.js"></script>
  </body>
</html>
